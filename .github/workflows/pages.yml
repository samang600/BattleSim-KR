# 웹 버전: main 에 푸시하거나 수동 실행하면 'web' 브랜치의 battle-kr/dist 를 빌드해 GitHub Pages 에 올림
# (v2.54.0 부터 새 기능은 안드로이드 앱 먼저 — 웹에 올리려면 web 브랜치를 main 으로 옮기고 이 워크플로를 실행)
# 주소: https://samang600.github.io/BattleSim-KR/
# 로비 시험판: online-lobby 브랜치가 있으면 /lobby/ 에 (개발 서버 사용) → https://samang600.github.io/BattleSim-KR/lobby/ (브랜치에 푸시한 뒤엔 이 워크플로를 수동 실행)
# 움직이는 도트 그림: sprites-ani 브랜치의 zip 4개를 풀어 /ani/ 에 (설정 › 포켓몬 그림 › 움직이는 도트 — 앱은 같은 zip 을 직접 받아 둠)
# 개발자 빌드: main 브랜치 최신 코드를 /dev/ 에 함께 올림 → https://samang600.github.io/BattleSim-KR/dev/ (저장 데이터는 정식 웹과 따로, 화면 아래 DEV 표시)
name: 웹 버전 배포 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web
          fetch-depth: 0 # 애니메이션 파일의 커밋 해시(jsDelivr 주소)를 구하려고 전체 기록이 필요
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node battle-kr/build.mjs
        env:
          GH_REPO: ${{ github.repository }}
      # 개발자 빌드 (main)
      - uses: actions/checkout@v4
        with:
          ref: main
          path: dev-src
          fetch-depth: 0
      - run: npm ci
        working-directory: dev-src
      - run: node battle-kr/build.mjs
        working-directory: dev-src
        env:
          GH_REPO: ${{ github.repository }}
          DEV_BUILD: '1'
          PACK_BRANCH: main
      - run: mkdir -p battle-kr/dist/dev && cp -r dev-src/battle-kr/dist/. battle-kr/dist/dev/
      # 로비 시험판 (online-lobby 브랜치, 없으면 건너뜀)
      - id: lobby
        run: git ls-remote --exit-code --heads https://github.com/${{ github.repository }} online-lobby && echo ok=1 >> $GITHUB_OUTPUT || echo ok=0 >> $GITHUB_OUTPUT
      - if: steps.lobby.outputs.ok == '1'
        uses: actions/checkout@v4
        with:
          ref: online-lobby
          path: lobby-src
          fetch-depth: 0
      - if: steps.lobby.outputs.ok == '1'
        run: npm ci && node battle-kr/build.mjs
        working-directory: lobby-src
        env:
          GH_REPO: ${{ github.repository }}
          DEV_BUILD: '1'
          PACK_BRANCH: online-lobby
      - if: steps.lobby.outputs.ok == '1'
        run: mkdir -p battle-kr/dist/lobby && cp -r lobby-src/battle-kr/dist/. battle-kr/dist/lobby/
      # 움직이는 도트 그림 (sprites-ani 브랜치, 없으면 건너뜀) → /ani/ : 「움직이는 도트」 설정이 씀
      - id: ani
        run: git ls-remote --exit-code --heads https://github.com/${{ github.repository }} sprites-ani && echo ok=1 >> $GITHUB_OUTPUT || echo ok=0 >> $GITHUB_OUTPUT
      - if: steps.ani.outputs.ok == '1'
        uses: actions/checkout@v4
        with:
          ref: sprites-ani
          path: ani-src
      - if: steps.ani.outputs.ok == '1'
        run: |
          mkdir -p battle-kr/dist/ani
          if [ -d ani-src/zip ]; then
            for p in front back front-shiny back-shiny; do n=ani$(echo $p | tr -d -); mkdir -p battle-kr/dist/ani/$p; unzip -q ani-src/zip/$n.zip -d battle-kr/dist/ani/$p; done
            cp ani-src/index.json battle-kr/dist/ani/
          else
            cp -r ani-src/ani/. battle-kr/dist/ani/
          fi
      # 트레이너 초상화 (portraits-ai 브랜치, 없으면 건너뜀) → /portraits/ : 시나리오 모드(개발자 빌드 시안)가 씀
      - id: portraits
        run: git ls-remote --exit-code --heads https://github.com/${{ github.repository }} portraits-ai && echo ok=1 >> $GITHUB_OUTPUT || echo ok=0 >> $GITHUB_OUTPUT
      - if: steps.portraits.outputs.ok == '1'
        uses: actions/checkout@v4
        with:
          ref: portraits-ai
          path: portraits-src
      - if: steps.portraits.outputs.ok == '1'
        run: cp -r portraits-src/portraits battle-kr/dist/portraits
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: battle-kr/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
